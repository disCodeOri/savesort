[package]
name = "savesort-desktop"
version = "0.1.0"
edition = "2021"
description = "SaveSort background sync client: tray shell around savesort-core."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
savesort-core = { path = "../core" }

# windows-native is required: without an explicit credential-store feature,
# keyring 3.x silently falls back to an in-memory mock that does not persist,
# so tokens vanish between calls and the app never appears signed in.
keyring = { version = "3", features = ["windows-native"] }
notify = "6"
notify-debouncer-full = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
